<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#100e0c"><title>TAROT — A breath of fate</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="scene" aria-hidden="true"></div>
<header><span>THE CELESTIAL COLLECTION</span><span>VOL. 01</span></header>
<section class="intro"><div class="eyebrow">✦ &nbsp; A BREATH OF FATE &nbsp; ✦</div><h1>TAROT</h1><div class="rule"><span>✧</span></div><p class="subtitle">Sincerity brings results<br>no refunds if it doesn't.</p></section>
<div class="stage" id="stage" role="button" tabindex="0" aria-label="點擊或按 Enter 吹動五張塔羅牌"><div class="orbit" aria-hidden="true"></div></div>
<section class="interaction"><div class="deck-label"><span>MAJOR ARCANA</span><span id="remaining">7 / 7</span></div><p id="status" role="status" aria-live="polite">心中默念，輕吹一口氣。</p>
<div class="controls"><button id="test">試吹一下 <span aria-hidden="true">↗</span></button><button id="mic" class="secondary">開啟麥克風</button></div>
<div class="wind-row"><span>WIND</span><div class="meter" role="meter" aria-label="風力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="bar"></i></div><span id="power">0%</span></div>
<button id="reset" class="reset">↻ &nbsp; 重新疊牌</button>
<details><summary>吹氣設定與說明</summary><label for="sensitivity">靈敏度<input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.5"><span>高</span></label><p>點擊牌堆也能試吹。麥克風音訊僅在裝置即時分析，不錄音、不上傳。此 Demo 以聲音能量估算風力，說話或環境噪音也可能觸發。</p></details>
</section><footer>TRUST THE MOMENT. &nbsp; ✦ &nbsp; LET IT UNFOLD.</footer><noscript>請啟用 JavaScript 以操作 Demo。</noscript></main><script src="app.js"></script></body></html>
