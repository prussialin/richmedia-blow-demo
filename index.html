<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102c29">
<title>一口氣，吹散全場 · RichMedia Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102c29;color:#f4efdf;font-family:system-ui,-apple-system,sans-serif}main{max-width:640px;margin:auto;padding:32px 24px max(24px,env(safe-area-inset-bottom));text-align:center}header{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:#c3ccb7}h1{font-size:clamp(32px,8vw,48px);letter-spacing:-2px;margin:38px 0 12px}p{color:#becbc3;line-height:1.7;font-size:14px}.stage{height:310px;position:relative;perspective:850px;overflow:hidden;border-radius:28px;background:radial-gradient(ellipse at 50% 75%,#356657 0,transparent 65%);margin:20px -12px}.table{position:absolute;bottom:35px;left:10%;width:80%;height:75px;border:1px solid #80987c55;border-radius:50%;box-shadow:0 25px 50px #0004}.card{position:absolute;left:calc(50% - 55px);top:132px;width:110px;height:155px;background:#fcf8ed;border:1px solid #d2caba;border-radius:10px;color:#202923;box-shadow:0 6px 12px #0003;transform-style:preserve-3d;will-change:transform;display:grid;place-items:center;font:64px Georgia,serif}.card.red{color:#b73d39}.corner{position:absolute;left:10px;top:8px;font:20px Georgia,serif}.corner.bottom{left:auto;top:auto;right:10px;bottom:8px;transform:rotate(180deg)}.badge{position:absolute;top:15px;width:100%;font-size:11px;letter-spacing:3px;color:#b6c5b1}.controls{display:grid;gap:12px}button{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:52px;padding:12px 18px;cursor:pointer;touch-action:manipulation;background:#e6ee99;color:#162c24}button.secondary{background:transparent;color:#edeedd;border:1px solid #83967b66}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.row{display:flex;gap:10px}.row button{flex:1}.meter{height:7px;background:#ffffff16;border-radius:10px;overflow:hidden;margin:16px 0 8px}.meter i{display:block;width:0;height:100%;background:#e6ee99;transition:width .08s}.meta{display:flex;justify-content:space-between;font-size:12px;color:#b6c5b1}label{display:flex;align-items:center;gap:12px;font-size:12px;color:#c9d0c0;margin:20px 0}input{flex:1;accent-color:#e6ee99;min-width:0}#status{min-height:48px;margin:14px 0;font-size:14px}footer{font-size:11px;color:#91a99d;line-height:1.8;margin-top:22px} @media(max-height:740px){main{padding-top:20px}h1{margin-top:24px}.stage{height:270px}.card{top:105px}}

.card{background:none;border:0;box-shadow:none;display:block}
.paper-panel{position:absolute;top:0;left:0;width:11.15px;height:155px;transform-origin:0 50%;transform-style:preserve-3d}
.paper-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fcf8ed}
.paper-print{position:absolute;top:0;width:110px;height:155px;display:grid;place-items:center;border:1px solid #d2caba;border-radius:10px}
.paper-back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#416355 0 3px,#d6dbc4 3px 4px);border-top:3px solid #fcf8ed;border-bottom:3px solid #fcf8ed}
.paper-panel:first-child .paper-face{border-radius:10px 0 0 10px}
.paper-panel:last-child .paper-face{border-radius:0 10px 10px 0}
</style>
</head>
<body><main>
<header><span>RICHMEDIA / LAB</span><span>EXPERIMENT 01</span></header>
<h1>一口氣，吹散全場。</h1><p>對著麥克風輕輕吹氣<br>讓桌上的撲克牌，跟著你的氣流飛起。</p>
<div class="stage" id="stage" role="img" aria-label="七張撲克牌，吹氣後會隨機彎折再翻轉飛散"><div class="badge">MAKE YOUR MOVE</div><div class="table"></div></div>
<div class="meter" role="meter" aria-label="風力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="bar"></i></div><div class="meta"><span>WIND POWER</span><span id="power">0%</span></div>
<p id="status" role="status" aria-live="polite">先開啟麥克風，或點「試吹一下」看效果。</p>
<div class="controls"><button id="mic">開啟麥克風</button><div class="row"><button class="secondary" id="test">試吹一下</button><button class="secondary" id="reset">重新疊牌</button></div></div>
<label for="sensitivity">靈敏度<input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.5"><span>高</span></label>
<footer>建議用 iPhone／iPad 的 Safari 開啟，並允許麥克風。<br>音訊僅在此裝置即時分析，不錄音、不上傳。<br>此 Demo 以聲音能量估算風力；說話或環境噪音也可能觸發。</footer>
<noscript>請啟用 JavaScript 以操作 Demo。</noscript>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const suits = ['♣','♦','♠','♥','♣','♦','♠'];
const cards = suits.map((s,i) => {
 const el=document.createElement('div');el.className='card'+((s==='♥'||s==='♦')?' red':'');
 const rank=['7','9','J','Q','K','A','A'][i];
 const print='<span class="corner">'+rank+s+'</span>'+s+'<span class="corner bottom">'+rank+s+'</span>';
 const panels=Array.from({length:10},(_,j)=>{const panel=document.createElement('div');panel.className='paper-panel';panel.innerHTML='<div class="paper-face"><div class="paper-print" style="left:'+(-j*11)+'px">'+print+'</div></div><div class="paper-face paper-back"></div>';el.appendChild(panel);return panel;});
 $('stage').appendChild(el);return {el,i,panels,launched:false};
});
function paperPose(bend,bias){let x=0,z=0;return Array.from({length:10},(_,j)=>{const angle=bend*(Math.pow(j/9,bias)-.35),rad=angle*Math.PI/180;const pose={transform:'translate3d('+x+'px,0,'+z+'px) rotateY('+angle+'deg)'};x+=11*Math.cos(rad);z-=11*Math.sin(rad);return pose;});}
function bendPaper(c,v,duration){const amount=(Math.random()<.5?-1:1)*(65+Math.random()*45+v*25),bias=.55+Math.random()*1.8;const stages=[[0,0],[.22,1],[.40,.65],[.62,-.35],[.80,.28],[1,.08]];const poses=stages.map(([offset,strength])=>paperPose(reduced?0:amount*strength,bias));c.panels.forEach((panel,j)=>panel.animate(stages.map(([offset],k)=>({...poses[k][j],offset})),{duration,easing:'ease-in-out',fill:'forwards'}));}

let stream=null,ctx=null,analyser=null,data=null,frame=0,session=0,running=false,flight=0,restore=0,last=0,energy=0,noise=.006,calUntil=0,samples=[],smooth=0,previous=0,previewTimer=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stack(){clearInterval(previewTimer);clearTimeout(restore);cards.forEach(c=>{c.el.getAnimations({subtree:true}).forEach(a=>a.cancel());c.panels.forEach((panel,j)=>{panel.style.transform='translate3d('+(j*11)+'px,0,0)';});c.launched=false;c.el.style.opacity='1';c.el.style.transform='translate3d('+(c.i-3)*2+'px,'+(6-c.i)*-2+'px,0) rotate('+((c.i-3)*2)+'deg)';});energy=0;flight=0;}
function wind(v){v=Math.max(0,Math.min(1,v));const n=Math.round(v*100);$('bar').style.width=n+'%';$('power').textContent=n+'%';$('meter').setAttribute('aria-valuenow',n);}
function launch(v){const c=[...cards].reverse().find(c=>!c.launched);if(!c)return;c.launched=true;flight++;const duration=reduced?180:1900-v*350;bendPaper(c,v,duration);const start=c.el.style.transform;const dx=(c.i%2?1:-1)*(130+Math.random()*130)*(.7+v);const dy=-240-v*190;const turn=(c.i%2?1:-1)*(120+v*220);const anim=c.el.animate([{transform:start,opacity:1},{transform:start+' translateY(-8px) rotateX(-12deg)',opacity:1,offset:.20},{transform:'translate3d('+dx*.2+'px,-65px,70px) rotateX(45deg) rotateZ('+turn*.15+'deg)',opacity:1,offset:.43},{transform:'translate3d('+dx+'px,'+dy+'px,150px) rotateX('+(200+v*300)+'deg) rotateY(120deg) rotateZ('+turn+'deg)',opacity:0}],{duration,easing:'cubic-bezier(.2,.65,.4,1)',fill:'forwards'});anim.onfinish=()=>{c.el.style.opacity='0';};if(flight===7){$('status').textContent='漂亮！全場吹散。再來一次？';restore=setTimeout(stack,2000);}}
function stop(message){session++;running=false;cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)ctx.close().catch(()=>{});ctx=null;analyser=null;data=null;wind(0);$('mic').disabled=false;$('mic').textContent='開啟麥克風';if(message)$('status').textContent=message;}
function tick(now){if(!running||!analyser)return;const dt=Math.min(.05,(now-previous)/1000||.016);previous=now;analyser.getByteTimeDomainData(data);let sum=0;for(const b of data){const x=(b-128)/128;sum+=x*x;}const rms=Math.sqrt(sum/data.length);if(now<calUntil){samples.push(rms);wind(0);}else{if(samples.length){samples.sort((a,b)=>a-b);noise=Math.max(.003,samples[Math.floor(samples.length*.6)]);samples=[];$('status').textContent='準備好了，對著麥克風輕輕吹氣。';}const v=Math.min(1,Math.max(0,rms-noise*1.8-.008)*Number($('sensitivity').value)*7);smooth+=(v-smooth)*.3;wind(smooth);energy=smooth>.12?energy+smooth*dt:Math.max(0,energy-dt);if(energy>.055&&now-last>140){launch(smooth);last=now;energy=0;}}frame=requestAnimationFrame(tick);}
$('mic').addEventListener('click',async()=>{if(running){stop('麥克風已關閉。');return;}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){$('status').textContent='請透過 HTTPS 網址，用 Safari 或 Chrome 開啟。';return;}const token=++session;$('mic').disabled=true;$('status').textContent='請允許麥克風存取…';try{const Audio=window.AudioContext||window.webkitAudioContext;ctx=new Audio();await ctx.resume();const obtained=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});if(token!==session){obtained.getTracks().forEach(t=>t.stop());return;}stream=obtained;analyser=ctx.createAnalyser();analyser.fftSize=1024;ctx.createMediaStreamSource(stream).connect(analyser);data=new Uint8Array(analyser.fftSize);running=true;samples=[];smooth=0;calUntil=performance.now()+1500;previous=performance.now();stack();$('mic').textContent='關閉麥克風';$('mic').disabled=false;$('status').textContent='校正環境音中，請安靜 1.5 秒…';stream.getAudioTracks()[0].onended=()=>{if(running)stop('麥克風連線已中斷，請重新開啟。');};frame=requestAnimationFrame(tick);}catch(e){if(token!==session)return;const msg=e.name==='NotAllowedError'?'麥克風未獲允許。請在瀏覽器網站設定允許後重試。':e.name==='NotFoundError'?'找不到麥克風，可先點「試吹一下」。':'無法啟動麥克風，請關閉其他錄音程式後重試。';stop(msg);}});
$('test').addEventListener('click',()=>{stack();$('status').textContent='試吹模式：紙牌隨機彎折，再翻轉飛散。';let n=0;previewTimer=setInterval(()=>{if(n++<4)launch(.8);else clearInterval(previewTimer);},130);});
$('reset').addEventListener('click',()=>{stack();$('status').textContent=running?'牌已疊好，繼續吹氣吧。':'牌已疊好，可以再試一次。';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('已暫停麥克風，回來後請重新開啟。');});window.addEventListener('pagehide',()=>stop());stack();
</script></body></html>
